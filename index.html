<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards de chamados</title>
    <link rel="stylesheet" href="style.css">
    <script src="chamados.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <form id="filtro" class="filtro">
        <div id="inputs-filtro" class="inputs-filtro">
            <input type="text" id="input-chamado" placeholder="Digite o nome do chamado">
            <input type="text" id="input-usuario" placeholder="Digite o nome do usuário">

            <select id="select-prioridade">
                <option value="">Todas as prioridades</option>
                <option value="Baixa">Baixa</option>
                <option value="Média">Média</option>
                <option value="Alta">Alta</option>
                <option value="Crítica">Crítica</option>
            </select>

            <select id="select-status">
                <option value="">Todos os status</option>
                <option value="Aberto">Aberto</option>
                <option value="Em progresso">Em progresso</option>
                <option value="Fechado">Fechado</option>
            </select>
        </div>
        <div id="botoes-filtrar" class="botoes-filtrar">
            <button id="btn-filtrar" type="button">
                Filtrar
            </button>
            <button id="btn-limpar" type="button">
                Limpar Filtros
            </button>
        </div>

    </form>
    <div class="chamados-container" id="chamados-container"></div>
</body>
</html>
